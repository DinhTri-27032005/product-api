name: Product API CI Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-product-api:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for Product API
        run: |
          for i in {1..12}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            echo "Waiting for Product API..."
            sleep 5
          done
          cat server.log
          exit 1

      - name: Test CREATE Product
        run: |
          curl --fail -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{
              "pid": "CI001",
              "pname": "CI Product",
              "price": 100000,
              "quantity": 5
            }'

      - name: Test READ Product
        run: |
          curl --fail http://localhost:3000/api/products/CI001

      - name: Test UPDATE Product
        run: |
          curl --fail -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{
              "pname": "CI Product Updated",
              "price": 120000,
              "quantity": 10
            }'

      - name: Test DELETE Product
        run: |
          curl --fail -X DELETE http://localhost:3000/api/products/CI001

      - name: Show server logs
        if: always()
        run: cat server.log